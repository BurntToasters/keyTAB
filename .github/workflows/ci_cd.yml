name: CI

on:
  push:
    branches: [main, beta]
  pull_request:
    branches: [main, beta]

permissions:
  contents: read

jobs:
  test:
    # actool crashes compiling the Icon Composer AppIcon.icon on macOS 15 hosts.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
      - name: Select the newest Xcode 26 or later
        run: |
          xcode="$(ls -d /Applications/Xcode_2[6-9]*.app 2>/dev/null | sort -V | tail -1)"
          if [ -z "$xcode" ]; then
            echo "::error::KeyTab needs Xcode 26 or newer (macOS 26 SDK). Installed: $(ls -d /Applications/Xcode*.app | tr '\n' ' ')"
            exit 1
          fi
          sudo xcode-select -s "$xcode"
          xcodebuild -version
      - uses: actions/setup-node@v6
        with:
          node-version: 22.12
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run sync-version -- --check
      - run: npm run validate
      - run: npm run test:all
      - run: KEYTAB_UNSIGNED_BUILD=1 npm run build:debug
      - run: npm run build:release-smoke
